name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: read repo, write Pages, OIDC for the deploy action
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # to wait for GitHub's legacy branch build (see deploy job)

# Only one deployment at a time; don't cancel a running production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages source (must be "GitHub Actions")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)"
          echo "Pages build_type: ${type}"
          if [ "${type}" = "legacy" ]; then
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1; then
              echo "::notice title=GitHub Pages umgestellt::Source wurde automatisch auf „GitHub Actions“ gestellt."
            else
              msg="GitHub Pages steht noch auf „Deploy from a branch“. GitHubs Branch-Build würde die App mit dem Quellcode überschreiben (graue Seite). Bitte Settings → Pages → Source: „GitHub Actions“ wählen. Bis dahin wartet dieser Workflow den Branch-Build ab und deployt danach."
              echo "::warning title=Pages-Quelle falsch::${msg}"
              { echo "### ⚠️ Pages-Quelle falsch"; echo "${msg}"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck & build
        run: npm run build
        env:
          # Optional: base URL of a self-hosted tracking proxy (Settings → Secrets and variables → Actions → Variables)
          VITE_TRACKING_API_URL: ${{ vars.VITE_TRACKING_API_URL }}

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Explain Pages misconfiguration
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          msg="GitHub Pages ist nicht (oder nicht für GitHub Actions) aktiviert. Settings → Pages → Build and deployment → Source: „GitHub Actions“ wählen und diesen Workflow erneut ausführen."
          echo "::error title=GitHub Pages nicht konfiguriert::$msg"
          echo "### ❌ GitHub Pages nicht konfiguriert" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Pages is still on "Deploy from a branch", GitHub runs its own build for the same commit
      # and would overwrite our deployment a few seconds later. Let it finish first, then deploy.
      - name: Wait for GitHub's branch build (legacy Pages source)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 36); do
            pending="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)"
            if [ "${pending}" = "0" ]; then echo "Kein laufender Branch-Build – deploye."; exit 0; fi
            echo "GitHubs Branch-Build läuft noch – warte 10 s (${attempt}/36) …"
            sleep 10
          done
          echo "::warning::Branch-Build nach 6 Minuten nicht fertig – deploye trotzdem."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Guards against a blank page: verifies the live site serves the Vite build
      # (hashed bundle) and not the raw repository source (/src/main.ts).
      - name: Verify live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 18); do
            html="$(curl -fsSL -H 'Cache-Control: no-cache' "${PAGE_URL}?v=${GITHUB_SHA}" || true)"
            if grep -q 'src="./assets/index-' <<<"$html" && ! grep -q 'src/main.ts' <<<"$html"; then
              # re-check after a pause: catches a later overwrite by another Pages deployment
              sleep 30
              again="$(curl -fsSL -H 'Cache-Control: no-cache' "${PAGE_URL}?v=${GITHUB_SHA}-2" || true)"
              if grep -q 'src="./assets/index-' <<<"$again" && ! grep -q 'src/main.ts' <<<"$again"; then
                echo "✅ ${PAGE_URL} liefert den Production-Build aus (stabil)."
                echo "### ✅ Live: ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::error title=Deployment überschrieben::Die App wurde kurz nach dem Deploy durch den Quellcode ersetzt (Pages-Quelle „Deploy from a branch“)."
              exit 1
            fi
            echo "Versuch ${attempt}: Build noch nicht live – warte 10 s …"
            sleep 10
          done
          msg="${PAGE_URL} liefert nicht den Vite-Build aus (evtl. Quelle „Deploy from a branch“). Settings → Pages → Source: „GitHub Actions“."
          echo "::error title=Deployment-Prüfung fehlgeschlagen::$msg"
          echo "### ❌ Deployment-Prüfung fehlgeschlagen" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
